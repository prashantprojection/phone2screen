name: phone2screen
description: "LAN & USB WebRTC Streamer Webcam Studio for Phone, PC, OBS, and Web."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # UI Framework
  material_ui: ^1.11.0

  # State Management
  flutter_riverpod: ^3.0.3

  # WebRTC
  flutter_webrtc: ^1.2.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3

  # Network
  network_info_plus: ^6.0.1

  # Permissions
  permission_handler: ^11.3.0

  # Platform Detection
  device_info_plus: ^10.1.0

  # Utilities
  uuid: ^4.5.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
